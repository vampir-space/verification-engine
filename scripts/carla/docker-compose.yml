services:
  carla:
    image: carlasim/carla:0.10.0
    container_name: carla
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "10200:2000"  # CARLA RPC port
      - "10201:2001"  # CARLA streaming port
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command: bash CarlaUnreal.sh -RenderOffScreen -nosound
  carla-visualizer:
    image: mjxu96/carlaviz
    container_name: carla-visualizer
    ports:
      - "10301:8080"  # Frontend UI
      - "10302:8081"  # Backend websocket stream
      - "10303:8089"  # Backend REST API
    environment:
      - CARLAVIZ_HOST_IP=0.0.0.0
      - CARLA_SERVER_IP=carla
      - CARLA_SERVER_PORT=2000
    restart: unless-stopped
    depends_on:
      - carla
