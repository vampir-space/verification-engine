services:
  nvidia-gpu-test:
    image: nvcr.io/nvidia/k8s/cuda-sample:nbody
    command: nbody -gpu -benchmark
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    
  nvidia-smi-test:
    image: nvidia/cuda:12.9.1-runtime-ubuntu22.04
    command: nvidia-smi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  simple-gpu-test:
    image: nvidia/cuda:12.9.1-base-ubi9
    command: sh -c "echo 'GPU Test Results:' && nvidia-smi -L && echo 'CUDA Environment:' && env | grep -i cuda"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
