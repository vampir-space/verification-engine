plugins {
  id 'java'
  id 'application'
}

group = 'com.example'
version = '0.1.0'

application {
  mainClass.set('com.example.Ros2WebSocketClient')
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.11.0'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
}
